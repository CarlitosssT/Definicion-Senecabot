defaults:
  - override hydra/job_logging: default
  - override hydra/launcher: basic

hydra:
  run:
    # Absolute via env var with a default -> no more cwd-dependent path doubling.
    # Override the repo root with $SENECA_HOME if the workspace moves.
    dir: ${oc.env:SENECA_HOME,/home/andre/Definicion-Senecabot/seneca_loco}/artifacts/trained_agents_rr/${now:%Y-%m-%d}/${now:%H-%M-%S}

# reference gait for the RR model (simulation/mocap/trajectory/trajectory_generation_rr.py), relative to seneca_loco/
reference: data/processed_data/trajectory_adapted_rr.npz

wandb:
  project: "deepmimic_senecabot_rr"

experiment:
  task_factory:
    name: ImitationFactory
    params: {}
  env_params:
    env_name: SenecaBotRR
    use_mjwarp: True
    nconmax: 26000
    njmax: 150
    headless: True
    record_camera: follow   # render recorded videos from this XML <camera> (e.g. follow / follow_west); null = default free camera
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: True
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    # RR: early termination when the trunk sinks > 6 cm below the reference's lowest height (0.359 m). The default
    # margin (0.3 m) never ends an episode, and the agents learned to walk crouched (trunk at 0.25 m, knees 15-24 deg
    # below the reference) instead of balancing in the reference posture.
    terminal_state_type: RootPoseTrajTerminalStateHandler
    terminal_state_params:
      root_height_margin: 0.06
    reward_type: MimicReward
    reward_params:
      # 2026-06-11: hand-set anti-shuffle weights. The previous values (Optuna v2 trial #28)
      # were tuned by the speed-blind v2 metric and produced an in-place shuffler
      # (speed_ratio 0.22, run 2026-06-11/13-40-31 — see CLAUDE.md diagnosis).
      # Pose terms revert to the 13-24-37 run's values (last agent that walked, at half pace);
      # forward pull comes from rootvel (sharpened) + a de-saturated qvel term.
      qpos_w_sum: 1.1   # RR: takes the weight of the dropped site terms (only knee / ankle are replicated); RRR 0.479
      qpos_w_exp: 5.9682311184743835
      qvel_w_sum: 0.65  # RR (RRR 0.342)
      qvel_w_exp: 1  # default 2.0 saturates exp(-e*dist) -> dead gradient (06-09/06-10 diagnosis)
      rpos_w_sum: 0.0   # RR model: only knee and ankle are replicated (joint terms), no site terms
      rquat_w_sum: 0.0
      rvel_w_sum: 0.0
      rootvel_w_sum: 0.5 # [SENECA LOCAL CHANGE] root forward-velocity reward weight (0 disables)
      rootvel_w_exp: 100.0 # [SENECA LOCAL CHANGE] exponent. 2026-09-27: the reference root speed is now the
                         # no-slip 0.218 m/s (was the sheep's 1.40 m/s), so 4.0 would pay standing still
                         # exp(-4*0.218^2/3)=0.94 and kill the anti-shuffle pull. At 100: still -> 0.21,
                         # 5 cm/s error -> 0.92. (Old reference: 4.0 gave still -> 0.07.)
      action_rate_coeff: 0.0025146232695822477 # NOTE: MimicReward multiplies this twice -> effective 6e-6 (~no-op)
      # [SENECA LOCAL CHANGE] 2026-09-27 anti-micro-hop terms (see SENECA_LOCAL_CHANGES.md).
      # Scales measured on the 100M/300M agents: reward/step ~2.0, sum((a_t-a_{t-1})^2) ~0.05-0.15,
      # sum((a_t-2a_{t-1}+a_{t-2})^2) ~0.06-0.35, contact match 0.61-0.73 (hind feet 0.40-0.75).
      action_rate_w: 0.1     # applied once; 0 disables. RR from scratch: 0.5 + 0.5 left the clipped reward at 0 (raise in a fine-tune)
      action_jerk_w: 0.1     # 2nd difference of actions -> directly penalizes stutter/micro-hops
      contact_w_sum: 0.5     # reward = weight * fraction of feet whose contact matches the reference phase
      contact_height: 0.037  # foot site z [m] below which the agent's foot counts as in contact (r=0.025 + 0.012)
      contact_ref_frac: 0.3  # reference stance = lowest 30% of each foot's height range. The hind double-dip stance
                             # (2 stances per cycle -> rewarded micro-hop) is now removed in the reference itself
                             # (trajectory_generation_rr.flatten_double_dip); a per-foot list is also accepted
      contact_sites:
        - fr_foot_mimic
        - fl_foot_mimic
        - br_foot_mimic
        - bl_foot_mimic
      # soft joint limits: the 1.40 m/s agent pressed its hind ankles on their -85 deg stop (0.15 s per cycle)
      joint_limit_w: 0.5
      joint_limit_margin_deg: 5.0
      joint_torque_coeff: 0.0033   # RR: crank torques are ~3x the joint torques (linkage amplification); RRR 0.0099
      joint_acc_coeff: 0.0005
      sites_for_mimic:
        - fr_foot_mimic
        - fl_foot_mimic
        - br_foot_mimic
        - bl_foot_mimic
        - base_mimic
        - fr_shank_mimic
        - fl_shank_mimic
        - br_shank_mimic
        - bl_shank_mimic
        - fl_thigh_mimic
        - fr_thigh_mimic
        - bl_thigh_mimic
        - br_thigh_mimic
      # [SENECA LOCAL CHANGE] drop the root's unobservable world x,y from qpos tracking
      # (keeps z height + orientation + joints). Replaces the joints_for_mimic approach,
      # which crashed because MimicReward assumes the root free joint is in the mimic set.
      track_root_xy: false
      # RR model: replicate only root + knee + ankle (the legs have no hip; bar joints follow from knee / ankle)
      joints_for_mimic: [root, fr_knee_joint, fr_ankle_joint, fl_knee_joint, fl_ankle_joint,
                         br_knee_joint, br_ankle_joint, bl_knee_joint, bl_ankle_joint]


  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 200
  total_timesteps: 300e6
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.995
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.3          # starting std (exploration noise). Raised 0.2 -> 0.3 (2026-06-10):
                         # more headroom above the collapse region; reward params untouched.
  learnable_std: true    # [TEST] std is now a trained param. log_std has NO floor in networks.py,
                         # so ent_coef below is the ONLY thing preventing collapse to 0.
                         # If runs still collapse: set false (fixed std = the regime the
                         # reward params were Optuna-tuned under) before touching reward weights.
  ent_coef: 1e-2         # entropy bonus that resists std collapse. 5e-3 was observed too weak
                         # (std 0.2 -> 0.013, entropy -2.3 -> -35; see 06-09 post-mortem). Dial
                         # DOWN (e.g. 5e-3) if std balloons / policy stays too noisy; UP if it collapses.
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 100 # set to 0 to run validation episodes until convergence (no early stopping)
    num_envs: 100
    num: 24   # quick-test: must be <= num_updates (=total_timesteps//num_steps//num_envs). Restore to 10 for full runs.
    quantities:
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteOrientation
      - RelSiteVelocity
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - fr_foot_mimic
      - fl_foot_mimic
      - br_foot_mimic
      - bl_foot_mimic
      - base_mimic
      - fr_shank_mimic
      - fl_shank_mimic
      - br_shank_mimic
      - bl_shank_mimic
      - fl_thigh_mimic
      - fr_thigh_mimic
      - bl_thigh_mimic
      - br_thigh_mimic
    joints_to_ignore: []

control_config:
  torque_control:
    control_type: DefaultControl
    control_params: