hydra:
  run:
    dir: ${oc.env:SENECA_HOME,/home/andre/Definicion-Senecabot/seneca_loco}/artifacts/trained_agents_rr/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - finetune.init_agent=artifacts/trained_agents_rr/2026-11-04/07-19-30/PPOJax_final.pkl
    - finetune.reference=data/processed_data/trajectory_adapted_rr_1p40.npz
    - finetune.experiment.env_params.reward_params.qpos_w_exp=5.9682311184743835
    - +finetune.experiment.env_params.reward_params.action_rate_w=0.5
    - +finetune.experiment.env_params.reward_params.action_jerk_w=0.5
  job:
    name: train
    chdir: null
    override_dirname: +finetune.experiment.env_params.reward_params.action_jerk_w=0.5,+finetune.experiment.env_params.reward_params.action_rate_w=0.5,finetune.experiment.env_params.reward_params.qpos_w_exp=5.9682311184743835,finetune.init_agent=artifacts/trained_agents_rr/2026-11-04/07-19-30/PPOJax_final.pkl,finetune.reference=data/processed_data/trajectory_adapted_rr_1p40.npz
    id: ???
    num: ???
    config_name: conf_rr_finetune
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/andre/Definicion-Senecabot/seneca_loco
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/andre/Definicion-Senecabot/seneca_loco/simulation/training
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/andre/Definicion-Senecabot/seneca_loco/artifacts/trained_agents_rr/2026-11-04/08-06-02
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
