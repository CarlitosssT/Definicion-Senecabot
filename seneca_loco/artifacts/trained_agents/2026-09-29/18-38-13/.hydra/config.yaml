wandb:
  project: deepmimic_senecabot
finetune:
  init_agent: artifacts/trained_agents/2026-09-27/18-22-14/PPOJax_saved.pkl
  reference: data/processed_data/trajectory_adapted.preRootSpeed.bak.npz
  curriculum_frac: null
  init_std: null
  experiment:
    total_timesteps: 100000000.0
    lr: 5.0e-05
    learnable_std: true
    critic_warmup_updates: 10
    env_params:
      gravity_obs: true
      domain_randomization_type: SlopeRandomizer
      domain_randomization_params:
        slope_range_deg:
        - -30.0
        - 30.0
        curriculum_start_deg: 20.0
      terminal_state_type: UprightTerminalStateHandler
      terminal_state_params:
        max_tilt_deg: 50.0
        min_height: 0.15
      reward_type: SlopeLocomotionReward
      reward_params:
        target_speed: 1.4
        vel_sigma: 1.0
        vel_w: 1.5
        alive_w: 0.5
        yaw_rate_w: 0.5
        vz_w: 0.5
        ang_vel_w: 0.05
        roll_w: 5.0
        power_w: 0.0005
        torque_w: 0.0001
        action_rate_w: 0.5
        action_jerk_w: 0.5
        slip_w: 0.2
        air_time_w: 3.0
        air_time_min: 0.2
        contact_height: 0.027
        release_height: 0.037
