wandb:
  project: deepmimic_senecabot
experiment:
  task_factory:
    name: ImitationFactory
    params: {}
  env_params:
    env_name: SenecaBot
    use_mjwarp: true
    nconmax: 26000
    njmax: 150
    headless: true
    record_camera: follow
    horizon: 1000
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.torque_control.control_type}
    control_params: ${control_config.torque_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4792990831842575
      qpos_w_exp: 5.9682311184743835
      qvel_w_sum: 0.34248070562463884
      qvel_w_exp: 1
      rpos_w_sum: 0.6360403640349603
      rquat_w_sum: 0.2720356175290966
      rvel_w_sum: 0.15
      rootvel_w_sum: 0.5
      rootvel_w_exp: 4.0
      action_rate_coeff: 0.0025146232695822477
      joint_torque_coeff: 0.009895445299195107
      joint_acc_coeff: 0.0005
      sites_for_mimic:
      - fr_foot_mimic
      - fl_foot_mimic
      - br_foot_mimic
      - bl_foot_mimic
      - base_mimic
      - fr_shank_mimic
      - fl_shank_mimic
      - br_shank_mimic
      - bl_shank_mimic
      - fl_thigh_mimic
      - fr_thigh_mimic
      - bl_thigh_mimic
      - br_thigh_mimic
      track_root_xy: false
  hidden_layers:
  - 512
  - 256
  lr: 0.0001
  num_envs: 2048
  num_steps: 200
  total_timesteps: 100000000.0
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.995
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.3
  learnable_std: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 100
    num_envs: 100
    num: 24
    quantities:
    - JointPosition
    - JointVelocity
    - RelSitePosition
    - RelSiteOrientation
    - RelSiteVelocity
    measures:
    - EuclideanDistance
    - DynamicTimeWarping
    - DiscreteFrechetDistance
    rel_site_names:
    - fr_foot_mimic
    - fl_foot_mimic
    - br_foot_mimic
    - bl_foot_mimic
    - base_mimic
    - fr_shank_mimic
    - fl_shank_mimic
    - br_shank_mimic
    - bl_shank_mimic
    - fl_thigh_mimic
    - fr_thigh_mimic
    - bl_thigh_mimic
    - br_thigh_mimic
    joints_to_ignore: []
control_config:
  torque_control:
    control_type: DefaultControl
    control_params: null
